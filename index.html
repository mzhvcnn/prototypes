<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Prototypes</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #101010;
        color: #f2f2f2;
      }

      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 64px 24px 96px;
      }

      h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 700;
        line-height: 40px;
      }

      .intro {
        margin: 8px 0 40px;
        color: #9a9a9a;
        font-size: 15px;
        line-height: 22px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 24px;
      }

      .card {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #262626;
        border-radius: 16px;
        background: #181818;
        color: inherit;
        text-decoration: none;
        transition:
          transform 320ms cubic-bezier(0.32, 0.72, 0, 1),
          border-color 320ms ease;
      }

      .card:hover,
      .card:focus-visible {
        transform: translateY(-3px);
        border-color: #3a3a3a;
        outline: none;
      }

      .thumb {
        display: flex;
        justify-content: center;
        height: 300px;
        padding-top: 24px;
        overflow: hidden;
        background: linear-gradient(180deg, #202020, #141414);
      }

      .thumb img {
        width: 220px;
        height: auto;
        align-self: flex-start;
      }

      .copy {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 16px 18px 20px;
      }

      .title {
        font-size: 17px;
        font-weight: 600;
        line-height: 22px;
      }

      .description {
        color: #a8a8a8;
        font-size: 14px;
        line-height: 20px;
      }

      .updated {
        margin-top: 4px;
        color: #6e6e6e;
        font-size: 12px;
        line-height: 16px;
      }

      .empty {
        color: #9a9a9a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Prototypes</h1>
      <p class="intro">Clickable prototypes. Open one to try it in the browser.</p>
      <div class="grid" id="grid"></div>
    </main>
    <script>
      const grid = document.getElementById("grid");
      const dateFormat = new Intl.DateTimeFormat("en-US", { dateStyle: "medium", timeZone: "UTC" });

      fetch("prototypes.json", { cache: "no-store" })
        .then((response) => response.json())
        .then((prototypes) => {
          if (!prototypes.length) {
            grid.innerHTML = '<p class="empty">No prototypes yet.</p>';
            return;
          }
          prototypes
            .slice()
            .sort((a, b) => b.updated.localeCompare(a.updated))
            .forEach((prototype) => {
              const card = document.createElement("a");
              card.className = "card";
              card.href = `${prototype.slug}/`;

              const thumb = document.createElement("div");
              thumb.className = "thumb";
              const image = document.createElement("img");
              image.src = `${prototype.slug}/thumbnail.png`;
              image.alt = "";
              image.loading = "lazy";
              image.onerror = () => thumb.remove();
              thumb.append(image);

              const copy = document.createElement("div");
              copy.className = "copy";
              const title = document.createElement("span");
              title.className = "title";
              title.textContent = prototype.title;
              const description = document.createElement("span");
              description.className = "description";
              description.textContent = prototype.description;
              const updated = document.createElement("span");
              updated.className = "updated";
              updated.textContent = `Updated ${dateFormat.format(new Date(prototype.updated))}`;
              copy.append(title, description, updated);

              card.append(thumb, copy);
              grid.append(card);
            });
        })
        .catch(() => {
          grid.innerHTML = '<p class="empty">Couldn’t load the prototype list.</p>';
        });
    </script>
  </body>
</html>
